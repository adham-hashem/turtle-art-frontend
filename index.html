  <style>
    :root {
      /* UX-Friendly Background Colors - Soft off-white */
      --bg-1: #FAFAFA;
      --bg-2: #F9F9F9;
      --bg-3: #FFFFFF;

      /* Professional Text Colors - Soft dark grays */
      --primary: #1A3F2F;
      --primary-2: #1A3F2F;
      --accent: #1A3F2F;
      /* Emerald green for CTAs */
      --gold: #1A3F2F;
      /* Use green for accents */

      /* Text & UI Elements */
      --text: #1F2937;
      /* Primary text - soft dark */
      --text-muted: #6B7280;
      /* Secondary text - medium gray */
      --shadow: rgba(0, 0, 0, 0.08);

      /* Additional UX Colors */
      --border: #E5E7EB;
      /* Light gray borders */
      --hover-bg: #F3F4F6;
      /* Hover states */
      --surface: #FFFFFF;
      /* Cards and surfaces */
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      min-height: 100vh;
    }

    /* Initial Loading Screen */
    #initial-loader {
      position: fixed;
      inset: 0;
      background: linear-gradient(135deg, var(--bg-1) 0%, var(--bg-2) 50%, var(--bg-3) 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease-out;
    }

    #initial-loader.hidden {
      opacity: 0;
      pointer-events: none;
    }

    /* Decorative glow */
    #initial-loader::before {
      content: '';
      position: absolute;
      width: 360px;
      height: 360px;
      border-radius: 999px;
      background: radial-gradient(circle, rgb(254, 254, 254), rgb(255, 255, 255), transparent 65%);
      filter: blur(10px);
      transform: translateY(-40px);
    }

    #initial-loader img {
      width: 120px;
      height: 120px;
      border-radius: 999px;
      object-fit: cover;
      box-shadow: 0 20px 40px var(--shadow);
      animation: pulse 2s ease-in-out infinite;
      border: 4px solid rgb(255, 255, 255);
      position: relative;
    }

    #initial-loader h1 {
      margin-top: 18px;
      font-size: 28px;
      font-weight: 800;
      background: linear-gradient(90deg, var(--primary), var(--primary-2), var(--gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      position: relative;
    }

    #initial-loader p {
      margin-top: 8px;
      color: var(--text-muted);
      font-size: 16px;
      position: relative;
    }

    .loader-dots {
      display: flex;
      gap: 10px;
      margin-top: 26px;
      position: relative;
    }

    .loader-dots span {
      width: 12px;
      height: 12px;
      border-radius: 999px;
      animation: bounce 1.4s ease-in-out infinite;
      box-shadow: 0 10px 18px #1A3F2F;
    }

    .loader-dots span:nth-child(1) {
      background: var(--primary);
      animation-delay: 0s;
    }

    .loader-dots span:nth-child(2) {
      background: var(--accent);
      animation-delay: 0.2s;
    }

    .loader-dots span:nth-child(3) {
      background: var(--gold);
      animation-delay: 0.4s;
    }

    @keyframes pulse {

      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.05);
      }
    }

    @keyframes bounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-14px);
      }
    }
  </style>
